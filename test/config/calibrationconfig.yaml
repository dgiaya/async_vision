# AprilTag Calibration Configuration
# For PnP script

calibration:
  tag_size: 0.034           # Physical size of ONE AprilTag in meters 
  tag_family: "tag36h11"    # AprilTag family 
  tag_rows: 9               # Number of tags vertically 
  tag_cols: 6               # Number of tags horizontally 
  tag_spacing: 0.29       # Distance between tag edges expressed as a fraction of tag size (m)
  min_corners: 4            # Minimum corners needed for PnP
  ransac_reproj_threshold: 5.0
  ransac_confidence: 0.999
  
# Camera intrinsics

cam0:
  camera_name: "cam0"
  image_width: 1224
  image_height: 1024
  camera_matrix: [1466.9178986185345, 0.0, 633.7002690022355, 0.0, 1469.3066556679487, 514.2254487915606, 0.0, 0.0, 1.0] #fx,0,cx,fy,0,cy,0,0,1
